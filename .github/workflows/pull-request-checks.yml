# CI for smeltr.
#
# What this is defending. The repo drives a detached process that permanently
# DELETES ~70-90 GB library originals on a `good` verdict. Nothing here talks to
# that pipeline -- there are no secrets, no deploys, and no runner ever sees the
# NAS or the staging drive. What CI can do is prove, before a change reaches the
# Mac that runs the job, that the shipped logic still holds: the verdict
# thresholds still classify every completed encode the way they were calibrated
# to, every encode path still passes --all-audio/--all-subtitles, the decision
# path still does not import the dashboard, and no runtime artifact carrying the
# auth token has crept into the index.
#
# Design notes worth keeping:
#   * EVERY check is `bun run <script>` -- one package.json script per step,
#     nothing called directly. The lint job is `bun run lint` unrolled one
#     member per step, the test jobs are `bun run test` unrolled the same way,
#     and the smoke job is `bun run smoke`. A step that ran `shellcheck ...` or
#     `python -m unittest ...` by hand was a SECOND rendition of the gate the
#     hooks run, and two renditions drift the moment one is edited alone
#     (test_crf_picker.js was in the local runner for four days before it was
#     here). Unrolled rather than one `bun run lint` step so the Actions UI
#     names the check that went red. `test_repo_invariants.py::CiRunsThroughBun`
#     pins both: every run step is `bun run`, and every member of `lint` and
#     every `test:*` script is a step somewhere.
#   * Every action is pinned to a full commit SHA, not a tag. A tag is mutable;
#     `@v4` is a promise from someone else that today's v4 is yesterday's.
#     Dependabot (.github/dependabot.yml) proposes the bumps.
#   * permissions is read-only at the top level and nothing widens it. No job
#     here needs to write to the repo, and a workflow that cannot write cannot
#     be turned into one that does by a compromised dependency.
#   * The bash suites run on macOS because that is the only platform the shipped
#     scripts target: watchdog.sh's mtime_age() uses BSD `stat -f %m`, which
#     returns nothing on GNU coreutils, and the corpse/finished boundary it
#     guards would then be tested against behaviour that never runs in
#     production.
#   * The Python matrix floors at 3.9 because that is stock macOS python3.
#     `smeltr` resolves ${SMELTR_PYTHON:-python3}, so a clone on an unprepared
#     Mac runs on 3.9 -- and a 3.12-only f-string in report.py had already made
#     `smeltr report` a SyntaxError there.
#   * Every job and every step carries a `name:`. The Actions UI shows an
#     unnamed step as its `uses:`/`run:` line, which for `actions/checkout@<sha>`
#     is a 40-character hash and for a `run:` is its first line -- neither says
#     what the step is FOR when it is the one that went red.
#   * PR hygiene (title, body sections, commit subjects) is a separate workflow,
#     .github/workflows/pull-request-format-checker.yml. It only makes sense
#     on a pull_request event and has nothing to do with whether the code is
#     green.
#   * `workflow_call:` is here so .github/workflows/main-sanity-check.yml can
#     RUN this file on a push to `main` rather than list the same steps again.
#     Nothing has run on main since the push trigger came off, and `bun run
#     release` plus a plain `git push` both land there with no PR -- so a
#     direct-to-main commit was checked nowhere. A copied workflow would fix
#     that and reintroduce the drift this file's first design note is about:
#     the invariant suite reads THIS path, so a new `test:*` script would be a
#     step here and silently absent from the copy. The concurrency line below
#     already reads correctly when called: `github.event_name` is the caller's
#     event, so a push to main is never cancelled.

name: 🧪 Pull request checks

on:
  pull_request:
  workflow_call:

# Read-only. Nothing in this workflow writes to the repo, publishes, or deploys.
permissions:
  contents: read

# One run per ref. Superseded PR pushes are cancelled; main is never cancelled,
# because the run against a merged commit is the record of whether it was green.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------------- static
  # `bun run lint` is `bun run --sequential` over the ten `lint:*` /
  # `format:js:check` scripts. Each one is its own step here, in the same
  # order, so a red step names the tool. The hook runs the same scripts over
  # the staged files (`bun run lint:staged`).
  lint:
    name: 🧹 lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 📥 Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # bun is the ONLY JS runtime and task runner here; there is no node and
      # no npm on this runner. --ignore-scripts skips husky's `prepare` (and
      # the preinstall guard, which only exists to turn npm/yarn/pnpm away):
      # git hooks have no business on a runner.
      - name: 🥟 Set up bun (version from package.json `packageManager`)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: 📦 bun install (frozen lockfile, no lifecycle scripts, no husky)
        run: bun install --frozen-lockfile --ignore-scripts

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # ruff.toml is the only ruff config; the version is pinned by
      # `uvx ruff@<ver>` in package.json, so the runner only needs `uvx`.
      - name: ⚡ Install uv (provides `uvx ruff@<pinned>`)
        run: pip install --quiet uv

      # actionlint is part of `bun run lint` (lint:ci) since 2026-09-05 -- the
      # hook and the runner check the workflows the same way -- so the binary
      # has to exist here. Installed through Go's module system: pinned to the
      # version brew ships locally, and the Go checksum database verifies the
      # source, where a curl'd release binary would be trusted on faith.
      - name: 🎬 Install actionlint (same version as `brew install actionlint`)
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: 🔍 lint:js — oxlint --deny-warnings
        run: bun run lint:js

      - name: 🔤 lint:js:syntax — bun build --no-bundle every web/*.js
        run: bun run lint:js:syntax

      # Type checking, never transpiling: tsconfig.json is noEmit, and web/*.js
      # is checked WHERE IT LIES through checkJs. The browser still receives
      # the same file server.py inlines, so this adds a gate, not a build step.
      - name: 🧾 lint:ts — tsc --noEmit over web/*.js and the bun suites
        run: bun run lint:ts

      - name: 🐍 lint:py — ruff (F, E9, B, PLE)
        env:
          RUFF_OUTPUT_FORMAT: github
        run: bun run lint:py

      - name: 🧱 lint:py:syntax — every module compiles
        run: bun run lint:py:syntax

      - name: 🐚 lint:sh — shellcheck -S warning (smeltr, hooks, every .sh)
        run: bun run lint:sh

      - name: 🪞 lint:sh:staging — shellcheck (errors block, the rest is advisory)
        run: bun run lint:sh:staging

      - name: 🎬 lint:ci — actionlint over .github/workflows
        run: bun run lint:ci

      - name: 💅 format:js:check — oxfmt --check
        run: bun run format:js:check

      - name: 🖼️ lint:page — the page assembles with no placeholder left
        run: bun run lint:page

  # ---------------------------------------------------------------- python
  # The floor matters as much as the ceiling here: 3.9 is what stock macOS
  # ships, and `smeltr` will happily run on it. `test:py` is the first member
  # of `bun run test`; the shell and bun halves have their own jobs below.
  python:
    name: 🐍 python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python: ["3.9", "3.11", "3.12", "3.13"]
        include:
          # The platform the job actually runs on. One version is enough: the
          # ubuntu leg above already covers the version spread.
          - os: macos-15
            python: "3.13"
    steps:
      - name: 📥 Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🐍 Set up Python ${{ matrix.python }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      # No `bun install`: the scripts below are shell + python. bun is here
      # only as the task runner, so the step is the same command a person
      # types locally.
      - name: 🥟 Set up bun (version from package.json `packageManager`)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: 🧱 lint:py:syntax — every module compiles on this Python
        run: bun run lint:py:syntax

      # There is no ledger.jsonl on a fresh clone (it is gitignored -- the driver
      # appends to it every cycle, so a tracked copy conflicts constantly). The
      # calibration suite falls back to tests/fixtures/ledger-calibration.jsonl,
      # the 22 rows the thresholds were reasoned about.
      - name: 🧪 test:py — the unittest suite (calibration, layering, gates, …)
        run: bun run test:py

  # ------------------------------------------------------------------- bun
  # The projection strip, the repaint key, the pause toggle, the CRF picker and
  # the sysmon charts are pulled straight out of web/app.js and executed under
  # bun. The suites are TypeScript since 2026-09-05 and bun runs them with no
  # transpile step of ours; the types are CHECKED in the lint job, never here.
  # No install step: the suites have no dependencies. One step per
  # `test:js:*` script -- the invariant suite fails if a script has no step.
  browser-logic:
    name: 🌐 browser logic (bun)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 📥 Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🥟 Set up bun (version from package.json `packageManager`)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: 🎚️ test:js:crf — CRF picker, the menu IS the ladder
        run: bun run test:js:crf

      - name: ⏯️ test:js:pause — pause toggle is ONE native button
        run: bun run test:js:pause

      - name: 📐 test:js:projection — projection strip
        run: bun run test:js:projection

      - name: 🔑 test:js:repaint — repaint key carries shape, never a live number
        run: bun run test:js:repaint

      - name: 🖼️ test:js:sysmon-render — drawMon() against a recording 2D context
        run: bun run test:js:sysmon-render

      - name: 📊 test:js:sysmon-ui — sysmon chart logic
        run: bun run test:js:sysmon-ui

  # ----------------------------------------------------------------- shell
  # macOS on purpose: these test BSD-targeted scripts. See the header. One
  # step per `test:sh:*` script.
  shell:
    name: 🐚 shell suites (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: 📥 Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🥟 Set up bun (version from package.json `packageManager`)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      # ffprobe is what makes the corpse test meaningful -- a truncated encode
      # that probes "fine" and merely runs short is one of the two corpse shapes
      # and a missing-duration check walks straight past it.
      - name: 🍺 Install ffmpeg (ffprobe for the corpse test)
        run: brew install ffmpeg

      # The concurrency guards that decide whether a folder is judged and
      # RECORDED. core.record() appends with no duplicate guard, so a folder
      # judged twice writes a second ledger row and double-counts the reclaim.
      # With no X9 on the runner the suite falls back to the tracked
      # staging/autopilot.sh; the drift suite below is what keeps the two
      # identical.
      - name: 🔒 test:sh:autopilot — autopilot concurrency guards
        run: bun run test:sh:autopilot

      # Skips cleanly here (the staging drive is not mounted on a runner). Kept
      # in CI so the skip is visible rather than assumed: if it ever starts
      # FAILING instead of skipping, the reason is worth seeing.
      - name: 🪞 test:sh:drift — staging drift (skips, no X9 on a runner)
        run: bun run test:sh:drift

      # Whether `stop` can SEE the running dashboard. When it cannot, `start`
      # binds a SECOND server to a second port with a second token. Needs no
      # drive and no network -- it shadows ps/pgrep and fakes the processes.
      - name: 🔎 test:sh:launcher — launcher server discovery
        run: bun run test:sh:launcher

      # The queue/ + complete/ staging layout in the driver: migration off
      # the root, the encoding folder left alone, complete/ never staged.
      - name: 🔎 test:sh:layout — staging layout helpers
        run: bun run test:sh:layout

      - name: 🪜 test:sh:watch-ladder — encoder-aware band ladder rungs
        run: bun run test:sh:watch-ladder

      - name: 🏁 test:sh:watch-finish — end of the ladder finishes, other arm still kills
        run: bun run test:sh:watch-finish

      - name: 🐕 test:sh:watchdog — watchdog corpse/finished boundary
        run: bun run test:sh:watchdog

  # ----------------------------------------------------------------- smoke
  # Everything above tests parts. `bun run smoke` runs the actual entry points
  # in the condition CI is inherently in -- no NAS, no staging drive, no
  # ledger -- because "an unmounted NAS must not look like a finished job" is
  # a non-negotiable, and the code path that renders it is only reachable when
  # the roots really are gone. It is NOT part of `bun run test`: on the Mac
  # that runs the job the roots are mounted and these assertions are false by
  # construction.
  smoke:
    name: 💨 smoke (nothing mounted)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 📥 Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: 🥟 Set up bun (version from package.json `packageManager`)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      # SMELTR_DIR is an EMPTY scratch dir, per step (`runner` is not a
      # context a job-level env: may read): no ledger, no overrides, no flag.
      - name: 📴 smoke:report — the report says LIBRARY INCOMPLETE and PARTIAL
        env:
          SMELTR_DIR: ${{ runner.temp }}/smeltr
        run: bun run smoke:report

      - name: 🙈 smoke:next — next_title never claims the stop condition while blind
        env:
          SMELTR_DIR: ${{ runner.temp }}/smeltr
        run: bun run smoke:next

      # Never binds a socket: proves the page and the state payload can be
      # built. _PAGE is assembled from web/* at import, so this is also the
      # check that every placeholder resolves and the three CSP nonces are
      # still there -- a missing asset would otherwise render as a blank
      # screen behind a working HTTP 200.
      - name: 🖥️ build — the dashboard imports and builds a page
        env:
          SMELTR_DIR: ${{ runner.temp }}/smeltr
        run: bun run build

  # A single required check for branch protection. Adding a job above does not
  # mean remembering to add it to the protected-branch list. A required-check
  # rule matches the DISPLAY name, so the check to require is "✅ ci" -- rename
  # it and the rule silently stops requiring anything. The job id stays `ci`.
  ci:
    name: ✅ ci
    if: always()
    needs: [lint, python, browser-logic, shell, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: ⚖️ Verdict — every job must be exactly "success"
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          # Every result must be exactly "success". A substring test would pass
          # on "success failure" -- the string still contains "success".
          rc=0
          for r in $RESULTS; do
            echo "  $r"
            [ "$r" = success ] || rc=1
          done
          [ $rc -eq 0 ] || echo "one or more jobs did not succeed"
          exit $rc
