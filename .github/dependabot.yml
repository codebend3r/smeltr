# Actions are pinned to commit SHAs in .github/workflows/ci.yml, which is the
# point -- a tag can be moved, a SHA cannot. The cost is that a pinned SHA never
# picks up a security fix on its own, so Dependabot opens the bump PRs and CI
# proves them.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      # Matches the commit-format skill: SMLTR: <imperative subject>.
      prefix: "SMLTR:"
    labels: ["ci"]
  # NO `bun` ecosystem yet (removed 2026-09-05). bun 1.4 writes bun.lock as
  # lockfileVersion 2 and Dependabot's bun updater parses only version 1, so
  # every run failed with "Unsupported bun.lock 'lockfileVersion' 2" before
  # reading a single dependency (dependabot/dependabot-core#16026; the fix is
  # PR #16071). Re-add it once that ships. Never `npm` -- there is no
  # package-lock.json and the preinstall guard refuses npm anyway.
